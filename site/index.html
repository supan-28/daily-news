<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Daily News</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.ph{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:16/9;background:linear-gradient(135deg,hsl(var(--h) 45% 22%),hsl(calc(var(--h) + 40) 50% 10%));margin:0}
.ph-art{position:absolute;inset:0}
.ph-art i{position:absolute;border-radius:50%;background:hsl(var(--h) 70% 60%/.18)}
.ph-art i:nth-child(1){width:60%;aspect-ratio:1;right:-10%;top:-30%}
.ph-art i:nth-child(2){width:40%;aspect-ratio:1;left:8%;bottom:-25%;background:hsl(calc(var(--h) + 60) 70% 60%/.16)}
.ph-art i:nth-child(3){width:18%;aspect-ratio:1;left:45%;top:30%;background:hsl(var(--h) 80% 70%/.12)}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;font-size:12px;color:#e8ebf0;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.play{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;padding-left:3px}
.fact .ok em{background:#1f9d62}.fact .warn em{background:#d19a1c}.fact .ko em{background:#d6453d}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

:root{--bg:#07080b;--ink:#f3f5f8;--mut:#9aa3b2;--line:rgba(255,255,255,.12)}
body{background:#000;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:700px){body{background:radial-gradient(circle at 50% 0,#14161d,#000 70%)}.app{height:min(100dvh - 32px,920px);margin-top:16px;border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:12px 0 0;background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.bars{display:flex;gap:4px;padding:0 14px 10px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);transition:background .25s}
.bars i.on{background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid var(--line);backdrop-filter:blur(10px);color:#dfe4ec;white-space:nowrap}
.chip.on{background:#fff;color:#000;border-color:#fff}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 22px 28px;overflow:hidden;background:linear-gradient(170deg,hsl(var(--h) 40% 17%),hsl(calc(var(--h) + 30) 45% 7%) 70%)}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.card::before{width:420px;height:420px;right:-160px;top:90px;background:radial-gradient(hsl(var(--h) 75% 55%/.35),transparent 70%)}
.card::after{width:300px;height:300px;left:-140px;top:42%;background:radial-gradient(hsl(calc(var(--h) + 60) 70% 55%/.22),transparent 70%)}
.card>*{position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--h) 90% 78%);margin-bottom:14px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 90% 65%)}
.card h2{font-size:clamp(26px,7.4vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-bottom:16px;text-wrap:balance}
.card p.sum{font-size:17px;line-height:1.5;color:#d6dbe5;margin-bottom:18px}
.meta{font-size:13px;color:var(--mut);display:flex;gap:10px;margin-bottom:18px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;background:#fff;color:#000;font-weight:700;font-size:15px}
.cta svg{transition:transform .2s}
.cta:hover svg{transform:translateY(-3px)}
.num{position:absolute!important;left:18px;top:25%;font-size:150px;font-weight:800;letter-spacing:-.06em;line-height:1;color:hsl(var(--h) 80% 70%/.12);pointer-events:none}
.rail{position:absolute;right:14px;bottom:170px;z-index:2;display:flex;flex-direction:column;gap:14px}
.rail button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px)}
.rail button.on{background:#fff;color:#000}
.card{padding-right:22px}
.card .txt{padding-right:34px}
.sheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
.sheet .pane{position:relative;height:88%;background:#101218;border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sheet.open{pointer-events:auto}.sheet.open .scrim{opacity:1}.sheet.open .pane{transform:none}
.grab{padding:10px;display:flex;justify-content:center}.grab span{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.25)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:0 20px 8px}
.sh-head .tag{margin:0}
.x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.art{overflow-y:auto;padding:4px 20px 40px;overscroll-behavior:contain}
.art h3{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:6px 0 10px}
.art .lead{color:#c3cad6;font-size:16px;line-height:1.55;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.art .txtp{font-size:17px;line-height:1.7;color:#e3e7ee;margin-bottom:16px}
.art .ph{margin:20px 0}
.art h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:28px 0 12px}
.src{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;background:rgba(255,255,255,.03)}
.src b{font-size:15px}.src span{font-size:12px;color:var(--mut);white-space:nowrap}
.src:hover{background:rgba(255,255,255,.08)}
.fact{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:6px 16px 16px;margin-top:28px}
.fact h4{margin:14px 0 8px}
.fact ul{list-style:none;padding:0}
.fact li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fact em{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;margin-top:2px}
.fact strong{font-size:15px}.fact small{font-size:11px;color:var(--mut);margin-left:6px}
.fact li p{font-size:14px;color:#b9c1ce;margin-top:2px;line-height:1.45}
.ctx{margin-top:14px;font-size:14px;color:#cfd5df;line-height:1.5}.ctx b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mut);opacity:.6;z-index:1;pointer-events:none}
.brand{position:absolute;z-index:6;right:16px;top:calc(100% - 0px)}
.cimg{position:relative;margin:0 0 18px!important;border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-height:27vh;width:100%;background:linear-gradient(135deg,hsl(var(--h) 45% 22%),hsl(calc(var(--h) + 40) 50% 10%));flex:0 1 auto}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cimg figcaption{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px}
.card p.sum{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;font-size:12px;color:var(--mut);letter-spacing:.04em}
.hdr a{color:var(--mut);text-decoration:none;padding:4px 0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph .play{text-decoration:none;z-index:1}
.ph figcaption{z-index:1}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);line-height:1.6;padding:24px}
.car{margin:18px -20px 22px}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;scroll-snap-align:center;margin:0!important;background-size:cover}
.car.one .slide{flex-basis:100%}

.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s,transform .2s}
.dots i.on{background:#fff;transform:scale(1.25)}
.card>.cover{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.55}
.card>.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(7,8,11,.55),rgba(7,8,11,.35) 35%,rgba(7,8,11,.94) 78%)}
.hdr #date,.hdr .play-all,.hdr .rate,.hdr a{white-space:nowrap}
.hdr{gap:8px}
.hdr .play-all{background:none;color:var(--ink);font-size:12px;letter-spacing:.04em;padding:4px 10px;border:1px solid var(--line);border-radius:999px;margin-right:auto;margin-left:4px}
.hdr .play-all.on{background:#fff;color:#000}
.hdr .right{display:flex;gap:12px;align-items:center}
.sh-actions{display:flex;gap:8px;align-items:center}
.listen{display:flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600}
.listen.on{background:#fff;color:#000}
.rate{height:28px;min-width:40px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.rail{top:118px!important;bottom:auto!important;flex-direction:row!important;gap:10px!important}
.card .txt{padding-right:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:11px;font-weight:700;letter-spacing:.04em}
.lang b{padding:4px 8px;color:var(--mut)}
.lang b.on{background:#fff;color:#000}
.hdr .gear{font-size:16px;line-height:1;text-decoration:none}
.card>.cover{opacity:1}
.card>.cover::after{background:linear-gradient(rgba(7,8,11,.5) 0%,rgba(7,8,11,.2) 28%,rgba(7,8,11,.82) 58%,rgba(7,8,11,.96) 100%)}
.card.hc::before,.card.hc::after{display:none}
.card.hc h2,.card.hc p.sum{text-shadow:0 1px 14px rgba(0,0,0,.55)}

html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.art,.art *{-webkit-user-select:text;user-select:text}
button{transition:transform .15s ease,background .2s ease,color .2s ease,box-shadow .2s ease}
button:active{transform:scale(.93)}
.hdr{padding:0 14px 10px!important}
.hdr #date{font-size:12px;font-weight:600;color:#c8cfdb;letter-spacing:.02em}
.hdr .right{gap:8px!important}
.lang{background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.16)!important;padding:2px!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);height:32px;align-items:center}
.lang b{padding:0 10px!important;height:26px;display:grid;place-items:center;border-radius:999px;font-size:12px!important;color:#c8cfdb!important;transition:background .2s,color .2s}
.lang b.on{background:#fff!important;color:#07080b!important;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hdr .gear{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#e6eaf1;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.player{position:absolute;z-index:5;top:118px;left:14px;display:flex;gap:6px;align-items:center;padding:3px;border-radius:999px;background:rgba(10,12,18,.45);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.player .pa{display:flex;align-items:center;gap:7px;height:38px;padding:0 15px 0 12px;border-radius:999px;background:#fff;color:#07080b;font-size:13px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.player .pa.on{background:#ff4d5a;color:#fff}
.player .rate{height:38px;min-width:46px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.12)}
.rail button{width:46px!important;height:46px!important;background:rgba(10,12,18,.45)!important;border:1px solid rgba(255,255,255,.2)!important;color:#fff;-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.rail button.on{background:#fff!important;color:#07080b!important;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 6px 20px rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(255,255,255,0),0 6px 20px rgba(0,0,0,.35)}}
.chip{height:36px;padding:0 15px!important;font-size:13px;font-weight:600;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.16)!important;color:#e6eaf1!important;transition:background .2s,color .2s}
.chip.on{background:#fff!important;color:#07080b!important;border-color:#fff!important;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cta{height:54px;padding:0 8px 0 22px!important;justify-content:space-between!important;border-radius:999px!important;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cta svg{width:38px!important;height:38px!important;padding:11px;border-radius:50%;background:#07080b;color:#fff;flex:none}
.listen{height:40px!important;padding:0 16px!important;background:#fff!important;color:#07080b!important;font-weight:700!important;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.listen.on{background:#ff4d5a!important;color:#fff!important}
.x{width:40px!important;height:40px!important;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.16)}
.src{border-radius:14px!important;padding:14px 16px!important}

.top{padding-top:calc(10px + env(safe-area-inset-top))!important}
.top .bars{padding:0 14px 12px!important}
.hdr{display:flex!important;justify-content:space-between!important;align-items:center;padding:0 14px 12px!important}
.hdr .player{position:static!important;top:auto;left:auto;display:flex}
.hdr .player[hidden]{display:none}
.gc{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#e6eaf1;margin-left:auto}
.chips{align-items:center}
.rail{top:152px!important}
.card .tag{background:hsl(var(--h) 55% 38%);color:#fff!important;padding:7px 12px;border-radius:999px;font-size:11px!important;letter-spacing:.09em;width:fit-content;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card .tag::before{display:none}
.card h2{font-size:clamp(30px,8.6vw,38px)!important;line-height:1.08!important;letter-spacing:-.03em!important}
.sh-head .tag{background:hsl(var(--h) 55% 38%);color:#fff!important;padding:7px 12px;border-radius:999px;font-size:11px}
.sh-head .tag::before{display:none}
.art .car{margin-top:4px}
.hdr .lang{margin-left:auto}

.bgvid.on{opacity:1}
.card>.cover::after{transition:opacity .7s}
.card>.cover:not(.hasl):not(.hasv){animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1)}}
.card .txt{transition:opacity .6s ease,transform .6s ease}
.card.clean .txt{opacity:0;transform:translateY(14px);pointer-events:none}
.card.clean>.cover::after{opacity:.22}
.card.clean .cta{width:auto;align-self:center;padding-left:20px!important;gap:14px}
.card.hv{cursor:pointer}
.snd .ic-off{display:none}
.app:not(.snd) .ic-on{display:none}
.rail .mb.on{background:#fff}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#07080b;font-size:14px;font-weight:700;padding:12px 18px;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.solo .feed,.solo .player,.solo .bars,.solo .chips,.solo .scrim,.solo #close{display:none!important}
.solo .top{background:none!important}
.solo .sheet{top:56px}
.solo .sheet .pane{height:100%!important;border-radius:22px 22px 0 0;transform:none!important}
.solo .grab{display:none}

.card>.cover{background-image:none!important}
.card>.cover::before{content:"";position:absolute;inset:0;background:var(--poster,none) center/cover no-repeat}
.card>.cover.hasv::before{inset:-40px;filter:blur(28px) brightness(.5) saturate(1.2)}
.slide.vid{background:#000}
.slide .vbg{position:absolute;inset:-24px;background:var(--poster,none) center/cover;filter:blur(20px) brightness(.5)}
.slide.vid>img.vthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide .sv{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.slide iframe.sv.v{width:auto;aspect-ratio:9/16;left:50%;transform:translateX(-50%)}
.slide.playing .play,.slide.playing>img.vthumb{display:none}
.slide .smute{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,12,18,.55);border:1px solid rgba(255,255,255,.2);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.slide:not(.playing) .smute{display:none}

.tapplay{position:absolute!important;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6!important;width:76px;height:76px;border-radius:50%;display:none;place-items:center;background:rgba(255,255,255,.92);color:#07080b;box-shadow:0 10px 36px rgba(0,0,0,.5);padding-left:4px}
.card.needtap .tapplay{display:grid}

.bgvid{position:absolute;left:0;width:100%;border:0;opacity:0;transition:opacity .7s;pointer-events:none}
.bgvid.on{opacity:1}
video.bgvid{top:0;height:100%;object-fit:contain;background:transparent}
.ybox{top:50%;aspect-ratio:16/9;transform:translateY(-50%);overflow:hidden;background:#000}
.ybox iframe{position:absolute;left:50%;top:50%;width:124%;height:124%;transform:translate(-50%,-50%);border:0;pointer-events:none}
.ybox.v{aspect-ratio:9/16;height:100%;width:auto;left:50%;top:0;transform:translateX(-50%)}
.ybox.v iframe{width:100%;height:100%}

.bgvid.loopv{top:0;height:100%;object-fit:cover}
.card>.cover.hasl::before{filter:none;inset:0}
.fcredit{margin:-8px 0 14px;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.02em}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="bars" id="bars"></div><div class="hdr"><span class="player" id="player" hidden><button class="pa" id="playall"></button><button class="rate" id="rate">1x</button></span><button class="lang" id="lang" aria-label="Language"><b data-l="en">EN</b><b data-l="it">IT</b></button></div><div class="chips" id="chips"></div></div>
  <div class="feed" id="feed" tabindex="0"></div>

  if(e.target.closest('[data-mute]')){setMuted(!MUTED);return}
  {const c=e.target.closest('.card');if(c&&c.classList.contains('needtap')&&!e.target.closest('button:not([data-tap]),a')){deactivate(c);activate(c);return}}
  if(!e.target.closest('button,a')){const c=e.target.closest('.card');if(c&&c.querySelector('.bgvid')){clearTimeout(c._t);c.classList.toggle('clean');const w=c.querySelector('.bgvid');if(w&&w._pl){try{w._pl.playVideo()}catch{}}}}
  const o=e.target.closest('[data-open]');if(o)openSheet(+o.dataset.open);
  const sh=e.target.closest('[data-share]');if(sh)shareItem(+sh.dataset.share);
};
$('#art').addEventListener('click',e=>{
  if(e.target.closest('[data-mute]')){setMuted(!MUTED);return}
  const b=e.target.closest('[data-play]');if(b)playSlide(b.closest('figure'));
});
function openSheet(id){
  const it=ITEMS.find(x=>x.id===id),s=secOf(it.sec),p=it.body||[];
  $('#shtag').textContent=s.name+(it.topic&&it.topic!==it.sec?' · '+secOf(it.topic).name:'');$('#shtag').style.setProperty('--h',s.h);
  const para=x=>x?`<p class="txtp">${esc(x)}</p>`:'';
  $('#art').innerHTML=`${carousel(it)}<h3>${esc(it.title)}</h3><p class="lead">${esc(it.summary)}</p>
  ${p.map(para).join('')}
  <h4>${t_('srcH')} (${it.sources.length})</h4>${srcList(it)}${factBox(it)}`;
  CURID=id;setBtn($('#listen'),false);$('#art').scrollTop=0;document.querySelectorAll('.card').forEach(deactivate);sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');setTimeout(observeSlides,350);
}
function closeSheet(){if(SOLO)return;stopSpeech();sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');if(SOBS)SOBS.disconnect();document.querySelectorAll('#art .slide').forEach(stopSlide);const i=Math.round(feed.scrollTop/feed.clientHeight),c=feed.children[i];if(c&&c.classList.contains('card'))activate(c)}
$('#close').onclick=$('#scrim').onclick=closeSheet;
$('#sheetshare').onclick=()=>shareItem(CURID);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(!sheet.classList.contains('open')){
    if(e.key==='ArrowDown'||e.key==='j')feed.scrollBy({top:feed.clientHeight,behavior:'smooth'});
    if(e.key==='ArrowUp'||e.key==='k')feed.scrollBy({top:-feed.clientHeight,behavior:'smooth'});
    if(e.key==='Enter'){const i=Math.round(feed.scrollTop/feed.clientHeight);if(list[i])openSheet(list[i].id)}
  }
});

const TTS=('speechSynthesis' in window)?window.speechSynthesis:null;
let AUD=null,MAN=null,CURID=null,voice=null,gen=0,rate=+(localStorage.getItem('rate')||1),speakKey=null;
const RATES=[1,1.25,1.5,0.85];
function pickVoice(){
  if(!TTS)return;const v=TTS.getVoices().filter(x=>x.lang.toLowerCase().startsWith(LANG));
  const score=x=>(/premium|enhanced|natural|neural/i.test(x.name)?4:0)+(/en-GB|en-US|it-IT/i.test(x.lang)?2:0)+(x.localService?1:0);
  voice=v.sort((a,b)=>score(b)-score(a))[0]||null;
}
if(TTS){pickVoice();TTS.onvoiceschanged=pickVoice}
function setBtn(b,on){if(!b)return;b.classList.toggle('on',on);const l=b.querySelector('span');if(l)l.textContent=on?t_('stop'):t_('listen')}
const IC_PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',IC_STOP='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function paSet(on){const b=$('#playall');if(b)b.innerHTML=(on?IC_STOP:IC_PLAY)+'<span>'+(on?t_('stop'):t_('playall'))+'</span>'}
function allBtns(){return [...document.querySelectorAll('.lb,#listen,#playall')]}
function stopSpeech(){gen++;speakKey=null;if(TTS)TTS.cancel();if(AUD){AUD.onended=AUD.onerror=null;AUD.pause();AUD=null}allBtns().forEach(b=>b.classList.remove('on'));setBtn($('#listen'),false);paSet(false)}
function pieces(text){
  const out=[];let cur='';
  for(const sn of text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*\s*/g)||[text]){
    if((cur+sn).length>170&&cur){out.push(cur);cur=sn}else cur+=sn;
  }
  if(cur)out.push(cur);return out;
}
const aurl=(id,kind)=>{const f=`${DATA.date}/${id}-${LANG}-${kind}.mp3`;return MAN&&MAN.has(f)?`audio/${f}`:null};
function markOn(btn){btn.classList.add('on');if(btn.id==='listen')setBtn(btn,true);if(btn.id==='playall')paSet(true)}
function playUrls(key,urls,btn){
  setMuted(true);
  if(speakKey===key){stopSpeech();return}
  stopSpeech();speakKey=key;const my=gen;markOn(btn);let i=0;
  const next=()=>{
    if(my!==gen)return;
    if(i>=urls.length){stopSpeech();return}
    const a=new Audio(urls[i++]);a.playbackRate=rate;a.onended=next;a.onerror=()=>{if(my===gen)stopSpeech()};AUD=a;
    a.play().catch(()=>{if(my===gen)stopSpeech()});
  };
  next();
}
function speak(key,texts,btn){
  setMuted(true);
  if(!TTS)return;
  if(speakKey===key){stopSpeech();return}
  stopSpeech();speakKey=key;const my=gen;
  markOn(btn);
  const q=texts.flatMap(pieces);let i=0;
  const next=()=>{
    if(my!==gen)return;
    if(i>=q.length){stopSpeech();return}
    const u=new SpeechSynthesisUtterance(q[i++]);u.rate=rate;u.lang=t_('tts');if(voice){u.voice=voice;u.lang=voice.lang}
    u.onend=next;u.onerror=()=>{if(my===gen)stopSpeech()};
    TTS.speak(u);
  };
  next();
}
const itemText=(it,full)=>[it.title+'.',it.summary,...(full?it.body:[])];
if(TTS){
  $('#listen').hidden=false;$('#player').hidden=false;paSet(false);
  $('#rate').textContent=rate+'x';
  $('#rate').onclick=()=>{rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];localStorage.setItem('rate',rate);$('#rate').textContent=rate+'x';if(AUD){AUD.playbackRate=rate;return}if(speakKey){const k=speakKey;speakKey=null;/* restart at new rate */const btn=k==='all'?$('#playall'):k.startsWith('f')?$('#listen'):document.querySelector(`[data-listen="${k.slice(1)}"]`);btn&&btn.click()}};
  $('#listen').onclick=()=>{const it=ITEMS.find(x=>x.id===CURID);const u=aurl(CURID,'f');u?playUrls('f'+CURID,[u],$('#listen')):speak('f'+CURID,itemText(it,true),$('#listen'))};
  $('#playall').onclick=()=>{const us=list.map(it=>aurl(it.id,'s'));if(us.length&&us.every(Boolean))return playUrls('all',us,$('#playall'));speak('all',list.flatMap((it,n)=>[`${t_('story')} ${n+1}.`,...itemText(it,false)]),$('#playall'))};
  feed.addEventListener('click',e=>{const b=e.target.closest('[data-listen]');if(!b)return;const it=ITEMS.find(x=>x.id===+b.dataset.listen);const u=aurl(it.id,'s');u?playUrls('s'+it.id,[u],b):speak('s'+it.id,itemText(it,false),b)});
}
window.addEventListener('pagehide',stopSpeech);
function applyLang(first){
  setSections();ITEMS=RAW.map(localize).map(x=>({...x,media:sortMedia(x.media)}));
  try{localStorage.setItem('lang',LANG)}catch{}
  document.documentElement.lang=LANG;
  const dl=LANG==='it'&&DATA.i18n&&DATA.i18n.it&&DATA.i18n.it.date_label;
  DSHORT=new Date(DATA.date+'T12:00:00').toLocaleDateString(LANG==='it'?'it-IT':'en-GB',{weekday:'short',day:'numeric',month:'short'});
  document.querySelectorAll('#lang b').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('#close').setAttribute('aria-label',t_('close'));
  if(cur!=='all'&&!ITEMS.some(i=>i.sec===cur))cur='all';
  const idx=first?0:Math.round(feed.scrollTop/feed.clientHeight);
  renderChips();renderFeed();feed.scrollTop=idx*feed.clientHeight;
  setBtn($('#listen'),false);paSet(false);
  if(sheet.classList.contains('open')&&CURID!=null){const y=$('#art').scrollTop;openSheet(CURID);$('#art').scrollTop=y}
  pickVoice();
}
$('#lang').onclick=()=>{stopSpeech();LANG=LANG==='en'?'it':'en';applyLang()};
(async()=>{
  try{
    const r=await fetch(`data/${/^[\d-]+$/.test(qs.get('d')||'')?qs.get('d'):'latest'}.json`,{cache:'no-cache'});
    if(!r.ok)throw 0;DATA=await r.json();RAW=DATA.items;try{const m=await fetch(`audio/${DATA.date}/manifest.json`,{cache:'no-cache'});MAN=m.ok?new Set((await m.json()).files):null}catch{MAN=null}try{const m=await fetch(`loops/${DATA.date}/manifest.json`,{cache:'no-cache'});LOOPS=m.ok?await m.json():{}}catch{LOOPS={}}
  }catch{feed.innerHTML=`<div class="empty">${t_('empty')}</div>`;return}
  applyLang(true);
  if(SOLO){
    const id=+new URLSearchParams(location.search).get('a');
    if(ITEMS.some(x=>x.id===id))openSheet(id);else{$('#art').innerHTML=`<div class="empty">${t_('empty')}</div>`;sheet.classList.add('open')}
  }
})();
</script>
