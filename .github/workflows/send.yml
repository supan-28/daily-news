name: Send Telegram briefing
on:
  workflow_dispatch:
concurrency:
  group: send
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: send
        run: python3 scripts/send.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "daily-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "Mark briefing sent" && git push)
